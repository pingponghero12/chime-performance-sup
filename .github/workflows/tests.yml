name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - if: matrix.python-version != '3.12'
        run: python -m pip install -e ".[dev,pipeline]"
      - if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[dev,pipeline]" -Cwheel.cmake=true
          python -c "from chime_perf import _cpp"
      - run: python -m pytest
